<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Nouveau design Master Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════ DESIGN SYSTEM ══════════════ */
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface-2: #fffaf5;
  --text: #1c1917;
  --text-2: #78716c;
  --border: #eee;
  --primary: #16a34a;
  --primary-dark: #15803d;
  --primary-soft: #f0fdf4;
  --accent: #f97316;
  --accent-soft: #fff7ed;
  --shadow: 0 1px 3px rgba(0,0,0,.05), 0 8px 24px -8px rgba(0,0,0,.08);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.08), 0 16px 40px -12px rgba(22,163,74,.18);
  --radius: 20px;
}
html.dark {
  --bg: #12100e;
  --surface: #1e1b18;
  --surface-2: #26221e;
  --text: #f5f5f4;
  --text-2: #a8a29e;
  --border: #2e2a26;
  --primary: #22c55e;
  --primary-dark: #16a34a;
  --primary-soft: #12291a;
  --accent: #fb923c;
  --accent-soft: #2b1d10;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.5), 0 16px 40px -12px rgba(34,197,94,.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Outfit',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  transition:background .3s,color .3s;
  padding-bottom:90px;
}
button { font-family:inherit; cursor:pointer; border:none; }

/* ══════════════ HEADER CATALOGUE XL ══════════════ */
.hero {
  position:relative;
  border-radius:0 0 32px 32px;
  overflow:hidden;
  background:linear-gradient(135deg,#166534 0%,#16a34a 55%,#4ade80 130%);
  color:#fff; padding:56px 20px 28px;
}
.hero::before {
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 85% 15%, rgba(249,115,22,.35), transparent 45%),
             radial-gradient(circle at 10% 90%, rgba(255,255,255,.12), transparent 40%);
}
.hero-inner { position:relative; max-width:1080px; margin:0 auto; }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; }
.hero h1 { font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:-.5px; }
.hero p { margin-top:8px; color:#d1fae5; font-size:14px; max-width:420px; line-height:1.5; }
.hero-badges { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.hero-badge {
  background:rgba(255,255,255,.15); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);
  padding:6px 12px; border-radius:99px; font-size:12px; font-weight:600;
}
.theme-btn {
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3);
  color:#fff; width:44px; height:44px; border-radius:14px; font-size:20px;
  backdrop-filter:blur(8px); transition:transform .2s;
}
.theme-btn:hover { transform:scale(1.1) rotate(15deg); }

/* ══════════════ LAYOUT ══════════════ */
.container { max-width:1080px; margin:0 auto; padding:0 16px; }
.section-head {
  display:flex; justify-content:space-between; align-items:baseline;
  margin:28px 0 14px;
}
.section-head h2 { font-size:18px; font-weight:700; letter-spacing:-.3px; }
.section-head span { font-size:13px; color:var(--text-2); font-weight:500; }

/* ══════════════ GRILLE PRODUITS ══════════════ */
.grid {
  display:grid; gap:14px;
  grid-template-columns:repeat(2,1fr);
}
@media(min-width:640px){ .grid{ grid-template-columns:repeat(3,1fr); gap:18px; } }
@media(min-width:960px){ .grid{ grid-template-columns:repeat(4,1fr); } }

/* ══════════════ CARTE PRODUIT ══════════════ */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .25s ease, box-shadow .25s ease;
  animation:fadeUp .5s ease both;
}
.card:nth-child(2){ animation-delay:.06s }
.card:nth-child(3){ animation-delay:.12s }
.card:nth-child(4){ animation-delay:.18s }
.card:nth-child(5){ animation-delay:.24s }
.card:nth-child(6){ animation-delay:.3s }
.card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
@keyframes fadeUp { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
.card-img {
  aspect-ratio:4/3;
  width:100%; object-fit:cover; display:block; background:var(--surface-2);
}
.card-body { padding:12px 14px 14px; }
.card-title {
  font-size:14px; font-weight:600; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  min-height:38px;
}
.price-row { display:flex; align-items:baseline; gap:6px; margin-top:8px; flex-wrap:wrap; }
.price-promo { font-size:17px; font-weight:800; color:var(--primary); }
.price-old { font-size:12px; color:var(--text-2); text-decoration:line-through; }
.price-normal { font-size:17px; font-weight:800; }
.badge-promo {
  display:inline-block; background:linear-gradient(135deg,var(--accent),#ef4444);
  color:#fff; font-size:11px; font-weight:700; padding:4px 10px;
  border-radius:99px; margin-bottom:8px; letter-spacing:.3px;
  box-shadow:0 2px 8px rgba(249,115,22,.35);
}
.badge-promo::before { content:"🔥 "; }
.add-btn {
  margin-top:10px; width:100%; padding:10px;
  border-radius:13px; font-size:14px; font-weight:700;
  background:var(--primary-soft); color:var(--primary-dark);
  border:1.5px solid transparent;
  transition:all .2s;
}
html.dark .add-btn { color:var(--primary); }
.add-btn:hover { background:var(--primary); color:#fff; transform:scale(1.02); }
.add-btn:active { transform:scale(.96); }
.add-btn.added { background:var(--primary); color:#fff; }

/* ══════════════ BOUTON PANIER FLOTTANT ══════════════ */
.fab {
  position:fixed; bottom:22px; right:22px; z-index:50;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; padding:14px 22px; border-radius:99px;
  font-size:15px; font-weight:700;
  box-shadow:0 8px 30px -6px rgba(22,163,74,.55);
  animation:fabIn .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes fabIn { from{opacity:0; transform:translateY(40px) scale(.7)} to{opacity:1; transform:none} }
.fab-count {
  background:#fff; color:var(--primary-dark);
  width:26px; height:26px; border-radius:99px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800;
}
.fab.bump { animation:bump .35s ease; }
@keyframes bump { 40%{ transform:scale(1.12) } }

/* ══════════════ PANIER ══════════════ */
.cart-section { margin-top:48px; display:none; }
.cart-section.visible { display:block; animation:fadeUp .4s ease both; }
.cart-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
  display:flex; gap:14px; align-items:center;
  box-shadow:var(--shadow); margin-bottom:12px;
}
.cart-card img { width:72px; height:72px; border-radius:14px; object-fit:cover; }
.cart-info { flex:1; min-width:0; }
.cart-info .n { font-weight:600; font-size:14px; }
.cart-info .u { font-size:12px; color:var(--text-2); margin-top:2px; }
.qty { display:flex; align-items:center; gap:10px; margin-top:8px; }
.qty button {
  width:30px; height:30px; border-radius:9px;
  background:var(--surface-2); border:1px solid var(--border);
  font-size:16px; font-weight:700; color:var(--text); transition:transform .15s;
}
.qty button:active { transform:scale(.88); }
.cart-total {
  background:var(--primary-soft); border:1px solid color-mix(in srgb,var(--primary) 20%,transparent);
  border-radius:var(--radius); padding:18px;
  display:flex; justify-content:space-between; align-items:center; margin:16px 0;
}
.cart-total .lbl { font-size:14px; color:var(--text-2); }
.cart-total .val { font-size:22px; font-weight:800; color:var(--primary); }
.cta-wa {
  width:100%; padding:17px; border-radius:16px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; font-size:16px; font-weight:700;
  box-shadow:0 8px 30px -6px rgba(22,163,74,.5);
  transition:transform .2s;
}
.cta-wa:hover { transform:translateY(-2px); }
.cta-wa:active { transform:scale(.98); }

/* ══════════════ PANIER VIDE ══════════════ */
.empty {
  margin-top:48px; display:none;
  text-align:center; padding:44px 24px;
  background:var(--surface); border:1.5px dashed var(--border);
  border-radius:24px;
}
.empty.visible { display:block; animation:fadeUp .4s ease both; }
.empty .emoji { font-size:52px; display:block; animation:float 3s ease-in-out infinite; }
@keyframes float { 50%{ transform:translateY(-8px) } }
.empty h3 { margin-top:14px; font-size:18px; font-weight:700; }
.empty p { margin-top:6px; color:var(--text-2); font-size:14px; }
.empty-suggest { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:20px; text-align:left; }
.suggest-item {
  display:flex; gap:10px; align-items:center;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:14px; padding:10px; font-size:13px; font-weight:600;
  transition:transform .2s; cursor:pointer;
}
.suggest-item:hover { transform:translateY(-2px); }
.suggest-item img { width:44px; height:44px; border-radius:10px; object-fit:cover; }

/* ══════════════ NAV DÉMO ══════════════ */
.nav-demo { display:flex; gap:8px; margin-top:40px; justify-content:center; flex-wrap:wrap; }
.nav-demo button {
  padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600;
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  transition:all .2s;
}
.nav-demo button.active { background:var(--text); color:var(--bg); }
</style>
</head>
<body>

<!-- ══════════ HERO ══════════ -->
<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div>
        <h1>Ai Business 🍲</h1>
        <p>Cuisine béninoise authentique, préparée frais du jour. Livraison rapide dans tout Lomé.</p>
        <div class="hero-badges">
          <span class="hero-badge">🚚 Livraison quartier</span>
          <span class="hero-badge">⚡ Commande en 1 min</span>
          <span class="hero-badge">⭐ 4.8 · 132 avis</span>
        </div>
      </div>
      <button class="theme-btn" id="themeToggle" title="Mode clair/sombre">🌙</button>
    </div>
  </div>
</header>

<div class="container">
  <!-- ══════════ NAV DÉMO ══════════ -->
  <div class="nav-demo">
    <button class="active" data-view="catalogue">🛍️ Catalogue</button>
    <button data-view="cart">🛒 Panier plein</button>
    <button data-view="empty">📭 Panier vide</button>
  </div>

  <!-- ══════════ CATALOGUE ══════════ -->
  <div id="view-catalogue">
    <div class="section-head">
      <h2>Nos plats du jour</h2><span>6 produits</span>
    </div>
    <div class="grid" id="productGrid"></div>
  </div>

  <!-- ══════════ PANIER PLEIN ══════════ -->
  <div class="cart-section" id="view-cart">
    <div class="section-head"><h2>Mon panier</h2><span>3 articles</span></div>
    <div id="cartItems"></div>
    <div class="cart-total">
      <span class="lbl">Total commande</span>
      <span class="val" id="cartTotal">0 FCFA</span>
    </div>
    <button class="cta-wa">Commander tout sur WhatsApp 📲</button>
  </div>

  <!-- ══════════ PANIER VIDE ══════════ -->
  <div class="empty" id="view-empty">
    <span class="emoji">🛒</span>
    <h3>Votre panier est vide</h3>
    <p>Essayez l'un de nos best-sellers 👇</p>
    <div class="empty-suggest" id="suggest"></div>
    <button class="cta-wa" style="margin-top:20px" onclick="switchView('catalogue')">Voir tout le catalogue</button>
  </div>
</div>

<!-- ══════════ FAB ══════════ -->
<button class="fab" id="fab" onclick="switchView('cart')" style="display:none">
  🛒 Panier <span class="fab-count" id="fabCount">0</span>
</button>

<script>
/* ── MODE SOMBRE ── */
const toggle = document.getElementById('themeToggle');
toggle.onclick = () => {
  document.documentElement.classList.toggle('dark');
  toggle.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
};

/* ── DONNÉES FACTICES ── */
const IMG = id => `https://images.unsplash.com/${id}?w=400&h=300&fit=crop`;
const products = [
  {id:1, n:"Pinon sauce adjo",  old:1500, p:1000, img:IMG("photo-1547592180-85f173990554")},
  {id:2, n:"Tchiep poulet braisé", old:0, p:2500, img:IMG("photo-1565557623262-b51c2513a641")},
  {id:3, n:"Pâte rouge + poisson", old:2000, p:1500, img:IMG("photo-1585032226651-759b368d7246")},
  {id:4, n:"Riz gras au poulet",  old:0, p:1800, img:IMG("photo-1512058564366-18510be2db19")},
  {id:5, n:"Jus de bissap 1L",    old:1000, p:700,  img:IMG("photo-1497534446932-c925b458314e")},
  {id:6, n:"Alloco piment",       old:0, p:500,  img:IMG("photo-1601050690597-df0568f70950")},
];
const fmt = n => n.toLocaleString("fr-FR").replace(/\u202f/g," ") + " FCFA";

/* ── RENDU CATALOGUE ── */
const grid = document.getElementById('productGrid');
grid.innerHTML = products.map(p => `
  <div class="card">
    <img class="card-img" src="${p.img}" alt="${p.n}" loading="lazy">
    <div class="card-body">
      ${p.old ? `<span class="badge-promo">Promo</span>` : ""}
      <div class="card-title">${p.n}</div>
      <div class="price-row">
        ${p.old
          ? `<span class="price-promo">${fmt(p.p)}</span><span class="price-old">${fmt(p.old)}</span>`
          : `<span class="price-normal">${fmt(p.p)}</span>`}
      </div>
      <button class="add-btn" onclick="addToCart(this,${p.id})">🛒 Ajouter</button>
    </div>
  </div>`).join("");

/* ── PANIER ── */
let cart = [];
function addToCart(btn, id) {
  const p = products.find(x => x.id === id);
  const line = cart.find(l => l.p.id === id);
  line ? line.qty++ : cart.push({p, qty:1});
  btn.classList.add("added"); btn.textContent = "✅ Ajouté !";
  setTimeout(() => { btn.classList.remove("added"); btn.textContent = "🛒 Ajouter"; }, 1100);
  const fab = document.getElementById("fab");
  fab.style.display = "";
  document.getElementById("fabCount").textContent = cart.reduce((s,l)=>s+l.qty,0);
  fab.classList.remove("bump"); void fab.offsetWidth; fab.classList.add("bump");
  renderCart();
}

function changeQty(id, d) {
  const line = cart.find(l => l.p.id === id);
  line.qty += d;
  if (line.qty <= 0) cart = cart.filter(l => l.p.id !== id);
  renderCart();
  const total = cart.reduce((s,l)=>s+l.qty,0);
  const fab = document.getElementById("fab");
  document.getElementById("fabCount").textContent = total;
  if (!total) fab.style.display = "none";
}

function renderCart() {
  const box = document.getElementById("cartItems");
  box.innerHTML = cart.length ? cart.map(({p,qty}) => `
    <div class="cart-card">
      <img src="${p.img}" alt="">
      <div class="cart-info">
        <div class="n">${p.n}</div>
        <div class="u">${fmt(p.p)} / unité</div>
        <div class="qty">
          <button onclick="changeQty(${p.id},-1)">−</button>
          <b>${qty}</b>
          <button onclick="changeQty(${p.id},1)">+</button>
        </div>
      </div>
      <b style="color:var(--primary)">${fmt(p.p*qty)}</b>
    </div>`).join("")
    : `<p style="text-align:center;color:var(--text-2);padding:24px">Panier vide — ajoutez des produits depuis le catalogue.</p>`;
  document.getElementById("cartTotal").textContent = fmt(
    cart.reduce((s,l) => s + l.p.p * l.qty, 0));
}

/* ── SUGGESTIONS PANIER VIDE ── */
document.getElementById("suggest").innerHTML = products.slice(0,4).map(p => `
  <div class="suggest-item" onclick="switchView('catalogue')">
    <img src="${p.img}" alt="">
    <span>${p.n}<br><small style="color:var(--primary)">${fmt(p.p)}</small></span>
  </div>`).join("");

/* ── NAVIGATION DÉMO ── */
function switchView(v) {
  document.querySelectorAll(".nav-demo button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === v));
  document.getElementById("view-catalogue").style.display = v==="catalogue" ? "block":"none";
  document.getElementById("view-cart").classList.toggle("visible", v==="cart");
  document.getElementById("view-empty").classList.toggle("visible", v==="empty");
  document.getElementById("fab").style.display = (v==="catalogue" && cart.length) ? "flex" : "none";
  window.scrollTo({top:0, behavior:"smooth"});
}
document.querySelectorAll(".nav-demo button").forEach(b =>
  b.onclick = () => switchView(b.dataset.view));
</script>
</body>
</html>
